version: 0.2
phases:
  install:
    runtime-version:
      nodejs: 20
    commands:
      - npm install -g @angular/cli@17
  pre_build:
    commands:
      - npm install
  build:
    commands:
      - npx ng build --configuration production
      - echo "Checking Angular output directories"
      - pwd
      - ls -la
      - find dist -maxdepth 5 -name index.html
      - find dist -maxdepth 3 -type d
artifacts:
  base-directory: dist/sample-angular-app/browser
  files:
    - '**/*'
